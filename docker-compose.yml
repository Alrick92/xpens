services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xpens
      POSTGRES_USER: xpens
      POSTGRES_PASSWORD: xpens_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpens"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://xpens:xpens_password@db:5432/xpens
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PARSEFLOW_API_KEY: ${PARSEFLOW_API_KEY:-}
      PARSEFLOW_API_URL: ${PARSEFLOW_API_URL:-https://parseflow.dev/api/v1}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
